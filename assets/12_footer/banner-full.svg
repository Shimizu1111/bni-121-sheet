  <svg xmlns="http://www.w3.org/2000/svg" width="1560" height="200" viewBox="0 0 1560 200">
    <rect width="100%" height="100%" fill="#FFFFFF"/>

<rect x="20" y="20" width="1520" height="160" rx="14" fill="#0B1D3A"/>

<!-- left: mail circle + message -->
<circle cx="80" cy="100" r="26" fill="#1B3060"/>
<g transform="translate(64,84) scale(1.0)" fill="none" stroke="#FFFFFF"
   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 9 H26 A1 1 0 0 1 27 10 V23 A1 1 0 0 1 26 24 H6 A1 1 0 0 1 5 23 V10 A1 1 0 0 1 6 9 Z M5.5 10 L16 18 L26.5 10"/>
</g>
<text x="130" y="92" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15"
      font-weight="500" fill="#FFFFFF">AI活用や業務効率化でお困りのことがあれば、</text>
<text x="130" y="120" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="15"
      font-weight="500" fill="#FFFFFF">いつでもお気軽にご相談ください！</text>

<!-- divider -->
<line x1="660" y1="60" x2="660" y2="140" stroke="#1B3060" stroke-width="1"/>

<!-- email -->
<g transform="translate(688,90) scale(0.85)" fill="none" stroke="#FFFFFF"
   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 9 H26 A1 1 0 0 1 27 10 V23 A1 1 0 0 1 26 24 H6 A1 1 0 0 1 5 23 V10 A1 1 0 0 1 6 9 Z M5.5 10 L16 18 L26.5 10"/>
</g>
<text x="728" y="108" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="14"
      font-weight="500" fill="#FFFFFF">shimizu.katsunori@example.com</text>

<!-- phone -->
<g transform="translate(1080,90) scale(0.85)" fill="none" stroke="#FFFFFF"
   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9 5 C7.5 5 6 6.5 6 8 C6 18 14 26 24 26 C25.5 26 27 24.5 27 23 L27 20 L21 18 L19 21 C16 19.5 13 16.5 11.5 13 L14.5 11 L12.5 5 Z"/>
</g>
<text x="1120" y="108" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="14"
      font-weight="500" fill="#FFFFFF">090-1234-5678</text>

<!-- CTA button -->
<rect x="1310" y="78" width="220" height="44" rx="8" fill="#FFFFFF"/>
<text x="1404" y="106" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="14"
      font-weight="700" fill="#0B1D3A" text-anchor="middle">お問い合わせはこちら</text>
<g transform="translate(1492,96)" stroke="#0B1D3A" stroke-width="2" fill="none"
   stroke-linecap="round" stroke-linejoin="round">
  <path d="M0 6 L14 6 M9 1 L14 6 L9 11"/>
</g>

  </svg>
